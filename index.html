<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literati | Poetry Workspace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Floating Fireflies -->
    <div class="fireflies">
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
    </div>

    <div class="container">
        <header>
            <span class="est">✦ EST. 2026 ✦</span>
            <h1>Literati</h1>
            <p class="subtitle">A Curated Workspace for the Poetic Mind</p>
        </header>

        <main>
            <!-- Prompt Generator Card -->
            <section class="card">
                <div class="form-group">
                    <label for="categorySelect">Category:</label>
                    <select id="categorySelect">
                        <option value="nature">Nature & Wilderness</option>
                        <option value="dark-academia">Dark Academia</option>
                        <option value="melancholy">Melancholy & Nostalgia</option>
                        <option value="romantic">Romanticism</option>
                    </select>
                </div>

                <div id="promptDisplay" class="prompt-box">
                    Select a category and hit generate...
                </div>

                <div class="button-group">
                    <button type="button" onclick="handleGenerate()" class="btn btn-primary">Generate Prompt</button>
                    <button type="button" onclick="handlePin()" class="btn btn-secondary">📌 Pin to Jar</button>
                </div>
            </section>

            <!-- Drafts & Ideas Pad -->
            <section class="card">
                <h2>Drafts & Ideas Pad</h2>
                <textarea id="draftArea" placeholder="Jot down your stanzas, line ideas, or full poems"></textarea>
            </section>

            <!-- The Prompt Jar -->
            <section class="card">
                <h2>The Prompt Jar </h2>
                <p class="section-desc">Saved inspiration for later</p>
                <ul id="jarList" class="jar-list"></ul>
            </section>

            <!-- Lexicon Lookup -->
            <section class="card">
                <h2>Lexicon Lookup </h2>
                <div class="search-box">
                    <input type="text" id="dictInput" placeholder="Type a word..." onkeypress="if(event.key==='Enter') handleSearch()">
                    <button type="button" onclick="handleSearch()" class="btn btn-primary">Search</button>
                </div>
                <div id="dictResults" class="results-box">
                    Definitions & synonyms will appear here.
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
